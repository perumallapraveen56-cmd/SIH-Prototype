<div class="app-shell">
  <app-sidebar></app-sidebar>

  <div class="app-main">
    <app-header [unreadAlertsCount]="unreadAlertCount()"></app-header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Real-time High Risk Audio/Visual Alert Toast (Requirement #17 & #18) -->
  @if (activeToastAlert(); as toast) {
    <div class="alert-toast-container animate-slide-in">
      <div class="alert-toast high-risk">
        <div class="toast-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div class="toast-content">
          <div class="toast-header">
            <span class="toast-badge">NEW HIGH RISK ALERT</span>
            <span class="toast-time">Just now</span>
          </div>
          <h4 class="toast-title">{{ toast.project_name }}</h4>
          <p class="toast-reason">{{ toast.reason }}</p>
          <div class="toast-actions">
            <a [routerLink]="['/projects', toast.project_id]" (click)="dismissToast()" class="toast-btn view">
              Inspect Project
            </a>
            <a routerLink="/alerts" (click)="dismissToast()" class="toast-btn view-alerts">
              All Alerts
            </a>
            <button (click)="dismissToast()" class="toast-btn dismiss">
              Dismiss
            </button>
          </div>
        </div>
        <button class="toast-close-x" (click)="dismissToast()">&times;</button>
      </div>
    </div>
  }
</div>
