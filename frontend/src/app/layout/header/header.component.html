<header class="top-header">
  <div class="header-left">
    <div class="welcome-box">
      <span class="greeting-lead">Welcome back,</span>
      <h2 class="user-greeting">
        {{ authService.currentUser()?.full_name || 'Officer' }}
        <span class="role-badge" [attr.data-role]="authService.currentUser()?.role">
          {{ authService.currentUser()?.role || 'Officer' }}
        </span>
      </h2>
    </div>
  </div>

  <div class="header-center">
    <div class="sih-tag">
      <span class="tag-label">Smart India Hackathon</span>
      <span class="tag-ps">PS ID: SIH26017</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Sound Notification Toggle Button (Requirement #17) -->
    <button
      class="header-btn sound-btn"
      [class.sound-on]="soundService.soundEnabled()"
      [class.sound-off]="!soundService.soundEnabled()"
      (click)="onToggleSound()"
      [title]="soundService.soundEnabled() ? 'Sound Notifications: ON (Click to mute)' : 'Sound Notifications: OFF (Click to unmute)'"
    >
      @if (soundService.soundEnabled()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span class="btn-text">Sound ON</span>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <span class="btn-text">Sound OFF</span>
      }
    </button>

    <!-- Alerts Notification Bell -->
    <a routerLink="/alerts" class="header-btn alert-bell-btn" title="View Active Alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      @if (unreadAlertsCount > 0) {
        <span class="alert-count-badge">{{ unreadAlertsCount }}</span>
      }
    </a>

    <!-- Government Portal / User Profile Dropdown / Logout -->
    <div class="user-action-group">
      <button class="logout-btn" (click)="logout()" title="Logout from system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</header>
